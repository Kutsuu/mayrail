<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Поиск маршрутов Первомайских железных дорог.">
    <title>ПЖД | Поиск</title>
    <link rel="icon" href="assets/img/small.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mayrail-theme") || "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="assets/css/mayrail.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html#top" aria-label="Главная страница">
        <img src="assets/img/logo-compact.png" alt="Первомайские железные дороги">
      </a>
      <nav class="nav" id="primary-nav" aria-label="Основная навигация">
        <a class="is-active" href="search.html">Поиск</a>
        <a href="news.html">Новости</a>
        <a href="schedules.html">Расписания</a>
        <a href="services.html">Услуги</a>
        <a href="infrastructure.html">Инфраструктура</a>
        <a href="about.html">О нас</a>
        <a href="join.html">Присоединиться</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Включить тёмную тему" aria-pressed="false">
          <img class="theme-icon theme-icon-dark" src="assets/icons/dark-theme.svg" alt="" aria-hidden="true">
          <img class="theme-icon theme-icon-light" src="assets/icons/light-theme.svg" alt="" aria-hidden="true">
        </button>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="primary-nav" aria-expanded="false" aria-label="Открыть меню">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="section search-page-section" id="routes">
        <div class="container">
          <div class="page-back-row">
            <a class="page-back" href="index.html#routes">Назад</a>
          </div>
          <form class="route-panel route-search-panel search-page-panel" id="route-search" action="search.html" method="get" data-routes-source="data/routes.csv">
            <div class="field-grid">
              <label class="field station-field route-from">
                <span>Откуда</span>
                <input id="from" name="from" autocomplete="off" placeholder="Откуда" aria-autocomplete="list" aria-expanded="false" aria-controls="from-options" required>
                <div class="station-options" id="from-options" role="listbox" hidden></div>
              </label>
              <button class="icon-button route-swap" id="swap-stations" type="button" aria-label="Поменять станции местами">
                <img src="assets/icons/switch.svg" alt="" aria-hidden="true">
              </button>
              <label class="field station-field route-to">
                <span>Куда</span>
                <input id="to" name="to" autocomplete="off" placeholder="Куда" aria-autocomplete="list" aria-expanded="false" aria-controls="to-options" required>
                <div class="station-options" id="to-options" role="listbox" hidden></div>
              </label>
              <label class="field route-date">
                <span>Дата</span>
                <input id="date" name="date" type="date">
              </label>
              <fieldset class="field time-mode-field route-time-mode">
                <legend>Режим времени</legend>
                <div class="segmented-control" id="time-mode">
                  <label>
                    <input type="radio" name="timeMode" value="depart" checked>
                    <span>Отправление</span>
                  </label>
                  <label>
                    <input type="radio" name="timeMode" value="arrive">
                    <span>Прибытие</span>
                  </label>
                </div>
              </fieldset>
              <label class="field route-time">
                <span id="time-label">После</span>
                <input id="time" name="time" type="time" value="09:00">
              </label>
              <button class="button button-primary route-submit" type="submit">Найти</button>
            </div>

            <div class="results-list" id="results" hidden></div>
            <div class="route-results-actions" id="results-actions" hidden>
              <button class="button button-light load-more-routes" id="load-more-routes" type="button">Показать ещё</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-grid">
        <div class="footer-brand">
          <img src="assets/img/logo-wide.png" alt="Первомайские железные дороги">
          <p>© 2026 «Первомайские железные дороги».</p>
        </div>
        <div class="footer-info" aria-label="Справочная информация">
          <div class="footer-block">
            <span>Период работы</span>
            <strong>Отсутствует. Данные будут ближе к лету 2026.</strong>
          </div>
          <div class="footer-block">
            <span>Часы работы</span>
            <strong>ежедневно с 9:00 до 21:00</strong>
          </div>
          <div class="footer-block">
            <span>Контактная информация</span>
            <a class="footer-mail" href="mailto:info@mayrail.pro">
              <img src="assets/icons/mail.svg" alt="" aria-hidden="true">
              <span>info@mayrail.pro</span>
            </a>
          </div>
        </div>
      </div>
    </footer>

    <template id="route-card-template">
      <article class="route-card">
        <div class="route-summary" data-field="summary">
          <div class="route-times">
            <div class="route-time-point">
              <span class="route-date-label" data-field="depart-date" hidden></span>
              <strong data-field="depart"></strong>
            </div>
            <div class="route-line"></div>
            <div class="route-time-point route-time-arrive">
              <strong data-field="arrive"></strong>
            </div>
            <button class="route-toggle" data-field="toggle" type="button" aria-label="Показать остановки" aria-expanded="false" hidden></button>
          </div>
          <span class="route-date-label route-trip-date" data-field="arrive-date"></span>
          <div class="route-card-top">
            <div class="route-heading">
              <span class="line-pill"></span>
              <span class="route-direction" data-field="direction"></span>
            </div>
          </div>
          <div class="route-warning" data-field="warning" hidden>
            <img class="route-warning-icon" src="assets/icons/warning.svg" alt="" aria-hidden="true">
            <span data-field="warning-text"></span>
          </div>
        </div>
        <div class="route-stops" data-field="stops" hidden></div>
      </article>
    </template>

    <script>
      window.MAYRAIL_DATA_URL = "data/routes.csv";
    </script>

</html>
