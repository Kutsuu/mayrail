<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Услуги Первомайских железных дорог.">
    <title>ПЖД | Услуги</title>
    <link rel="icon" href="assets/img/small.png" type="image/png">
    <link rel="preload" href="assets/fonts/xn7gYHE41ni1AdIRggOxSuXd.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/xn7gYHE41ni1AdIRggexSg.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/ieVl2ZhZI2eCN5jzbjEETS9weq8-19a7DRs5.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/ieVl2ZhZI2eCN5jzbjEETS9weq8-19K7DQ.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/css/fonts.css">
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mayrail-theme") || "light";
        if (sessionStorage.getItem("mayrail-page-transition") === "1") {
          document.documentElement.classList.add("is-page-transition-pending");
        }
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="assets/css/mayrail.css">
  </head>
  <body>
    <div data-site-header></div>

    <main id="top">
      <section class="page-hero section-dark">
        <div class="container">
          <p class="eyebrow">Для клиентов</p>
          <h1>Услуги</h1>
        </div>
      </section>

      <section class="section page-section">
        <div class="container feature-grid feature-grid-three">
          <article class="feature-card service-card">
            <img src="assets/img/legacy/service-freight.jpg" alt="">
            <div>
              <h3>Грузовые перевозки</h3>
            </div>
          </article>
          <article class="feature-card service-card">
            <img src="assets/img/station-display.jpg" alt="">
            <div>
              <h3>Пассажирские перевозки</h3>
            </div>
          </article>
          <article class="feature-card service-card">
            <img src="assets/img/legacy/service-infrastructure.jpg" alt="">
            <div>
              <h3>Инфраструктура</h3>
            </div>
          </article>
        </div>

        <div class="container contact-strip">
          <span>Контактная информация</span>
          <a href="mailto:info@mayrail.pro">info@mayrail.pro</a>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/theme.js"></script>
  </body>
</html>
